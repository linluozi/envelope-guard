[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envelope-guard"
version = "0.1.0"
description = "Adversarial performance-envelope audit with certified dispatch policy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
envelope-guard = "envelope_guard.demo:main"

[tool.setuptools.packages.find]
include = ["envelope_guard*"]

[tool.setuptools.package-data]
envelope_guard = ["py.typed"]